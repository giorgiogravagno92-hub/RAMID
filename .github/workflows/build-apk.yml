name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build --workspace=frontend

      - name: Copy Web Assets to Android
        run: |
          mkdir -p frontend/android/app/src/main/assets/public
          cp -r frontend/dist/* frontend/android/app/src/main/assets/public/

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Compile Android APK (assembleDebug)
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release_apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release_apk/ramid.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramid-apk
          path: release_apk/ramid.apk

      - name: Publish GitHub Release with APK File
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Ramid Android App"
          body: |
            ### 📱 Download Ufficiale Ramid APK per Android

            File APK pronto per l'installazione su smartphone Android:
            - **Download diretto**: [ramid.apk](https://github.com/${{ github.repository }}/releases/download/latest/ramid.apk)
          files: release_apk/ramid.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
