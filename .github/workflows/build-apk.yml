name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build Android APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release_apk/ramid.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramid-android-apk
          path: release_apk/ramid.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Ramid Android App (APK)"
          body: |
            ### 📱 Download Ufficiale App Ramid per Android (.apk)
            
            Puoi scaricare e installare direttamente il file APK sul tuo smartphone Android:
            - **Download diretto**: [ramid.apk](https://github.com/${{ github.repository }}/releases/download/latest/ramid.apk)
            
            #### Istruzioni per l'installazione:
            1. Scarica il file `ramid.apk` sul tuo telefono.
            2. Aprilo e premi **"Installa"** (se richiesto, consenti l'installazione da questa sorgente/browser).
            3. L'app Ramid comparirà tra le applicazioni installate sul tuo smartphone.
          files: release_apk/ramid.apk
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
