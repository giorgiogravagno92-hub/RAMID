[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ../package.json ../package-lock.json"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/ramid.apk"
  to = "https://github.com/giorgiogravagno92-hub/RAMID/releases/download/latest/ramid.apk"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

